name: CI

on:
  push:
  pull_request:

jobs:
  host:
    name: Host tests (test HAL), template port, Linux master
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DHDX_WERROR=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Master, with its own Makefile
        run: make -C master/linux CFLAGS="-O2 -Wall -Wextra -Werror -std=c11"
      - name: Scripts and tools
        run: |
          sh -n master/linux/tunnel-up.sh
          python3 -m py_compile tools/bustest.py
          python3 tools/bustest.py --help > /dev/null

  samd21:
    name: SAMD21 port (Cortex-M0+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Configure
        run: >
          cmake -B build-samd21 -DHDX_PORT=samd21 -DHDX_WERROR=ON
          -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake
      - name: Build (member sizes in the log)
        run: cmake --build build-samd21

  rp2040:
    name: RP2040 port (pico-sdk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.2.0
          path: pico-sdk
      - name: Toolchain
        run: >
          sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
          libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Configure
        run: >
          cmake -B build-rp2040 -DHDX_PORT=rp2040 -DHDX_WERROR=ON
          -DPICO_SDK_PATH=${{ github.workspace }}/pico-sdk
      - name: Build (member sizes in the log)
        run: cmake --build build-rp2040 --parallel
